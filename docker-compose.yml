# YAML anchor for the env block shared by web and worker (DRY).
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_URL: ${AUTH_URL}
  AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER}
  AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID}
  AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET}
  MEILI_HOST: http://meilisearch:7700
  MEILI_KEY: ${MEILI_KEY}
  FILES_DIR: /data/files
  NODE_ENV: production
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  # Required by lib/env.ts. Without these both web and worker fail Zod
  # validation at boot and crash-loop, which is what `docker compose up` did
  # before they were listed here.
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY}
  WEB_PUSH_CONTACT_EMAIL: ${WEB_PUSH_CONTACT_EMAIL}
  FORWARDEMAIL_API_KEY: ${FORWARDEMAIL_API_KEY}
  FORWARDEMAIL_FROM_ADDRESS: ${FORWARDEMAIL_FROM_ADDRESS}
  # Plan 4c — Ask / RAG. Opt-in per deployment; flip ASK_ENABLED=true and
  # set VOYAGE_API_KEY when you want the feature live.
  ASK_ENABLED: ${ASK_ENABLED:-false}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  OCR_BACKEND: ${OCR_BACKEND:-tesseract}
  # Optional observability vars. Set these once GlitchTip / Loki are running.
  # SENTRY_DSN: ${SENTRY_DSN:-}
  # NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
  # SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
  # LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.51
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: house-manager:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment: *app-env
    volumes:
      - files:/data/files
    ports: ["3000:3000"]
    # Duplicated in scripts/smoke-image.sh, docs/README.md § Production, and the
    # production GitOps compose. Change one, change all four — only the smoke
    # script's copy is under automated test, so this one drifts silently.
    #
    # `exec` on the last command is deliberate but NOT load-bearing today —
    # don't remove it as redundant. BusyBox ash already exec-optimizes the final
    # command in an `&&` chain, so node is PID 1 and handles SIGTERM either way
    # (measured: stop 0s, exit 143). `exec` makes that independent of a BusyBox
    # implementation detail, and makes appending a trailing command obviously
    # wrong rather than silently fatal — without it, `… && node web/server.js &&
    # anything` leaves sh at PID 1, node as its child, and the container dies on
    # SIGKILL. See issue #401.
    command: sh -c "node_modules/.bin/prisma migrate deploy && node_modules/.bin/tsx prisma/seed.ts && exec node web/server.js"
    # Healthcheck comes from the image (see Dockerfile) — one definition for
    # both services rather than two that can drift.

  worker:
    build: .
    image: house-manager:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - files:/data/files
      - ${BACKUP_DIR:-./db-backups}:/backups
    command: node_modules/.bin/tsx worker/index.ts
    # Healthcheck comes from the image (see Dockerfile). The worker serves the
    # same /api/health path as web from its own health server, so it reports
    # unhealthy when it can no longer reach Postgres or has stopped servicing
    # the queue — neither of which `restart: unless-stopped` can detect.

volumes:
  pgdata:
  meilidata:
  files:
