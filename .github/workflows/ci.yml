name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners default to UTC -- the ONE timezone in which the calendar-date vs
  # instant bugs are all invisible (a UTC-midnight date read in UTC is a no-op).
  # Pinning a negative-offset zone means anything that leans on the runner's
  # local clock fails here rather than in production. NOTE: this only affects the
  # local `Date` ctor and un-zoned formatting -- the house tz is passed explicitly
  # to Intl, so this is hygiene, not a guard for that class. See
  # docs/superpowers/plans/2026-07-14-calendar-date-vs-instant.md.
  TZ: America/Chicago
  # Silence the Prisma CLI's "Update available" banner. Not cosmetic:
  # `migrate-check` captures stderr (`2>&1`) into the variable it greps for
  # schema drift, and the banner isn't in that step's allow-list, so it lands
  # in `residual` and fails the job. Whichever Prisma invocation wins the
  # version-check race prints it, so dropping this reintroduces an INTERMITTENT
  # failure, not an obvious one. Workflow-wide because unit/integration/e2e
  # shell out to Prisma too.
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

# The eight `pnpm/setup` steps below are deliberately byte-identical -- edit
# one, edit all. Each replaces what used to be a trio (pnpm/setup +
# actions/setup-node + an explicit `pnpm install --frozen-lockfile`): v3
# installs the JS runtime and runs the install itself.
#
# Nothing is version-pinned in this file any more, and that is the point --
# every version now comes from a file Renovate's `toolchain-versions` group
# already tracks in one PR (.nvmrc, package.json, Dockerfile; see #468):
#   - pnpm comes from package.json `packageManager`, which v3 reads when the
#     `version` input is omitted.
#   - Node comes from .nvmrc, which v3 auto-detects (it checks `.node-version`,
#     `.nvmrc`, then `.tool-versions`). That detection only runs while no Node
#     version is declared in `devEngines.runtime` -- adding one to package.json
#     would silently take precedence over .nvmrc, so pass `node-version-file`
#     explicitly here if that ever changes.
# `require-lockfile: true` is the ONLY input set, and it is non-default: it
# runs the install with `--frozen-lockfile`, and fails outright if
# pnpm-lock.yaml is missing rather than resolving from the registry, writing a
# fresh lockfile and exiting 0. That missing-lockfile failure is the load-
# bearing half -- pnpm already refuses to update an existing lockfile under CI.
#
# `cache` is deliberately LEFT AT ITS DEFAULT OF false, i.e. the pnpm store is
# not cached at all. It was on for exactly one merge (#487) and measured worse
# than no cache. Per job, from the run logs:
#   warm (prefix hit):  6.8-8.2s restore + 6.5s install = 13.3-14.7s
#   cold (no store):                      16.2-16.7s    = 16.2-16.7s
# The store only saves the *download*; pnpm still links all ~1026 packages into
# node_modules either way, and pulling 385MB back out of the Actions cache costs
# about as much as fetching them from the registry. So it buys 2-3s per job --
# ~3s of critical path, since the jobs are parallel.
#
# What it cost was the whole repo's cache quota. v3 appends
# `-<runId>-<attempt>-<uuid>` to the save key, so the exact key can NEVER match:
# every restore is a prefix fallback and all eight jobs unconditionally save
# their own ~385MB copy. That is 3.23GB written per run against a 10GB
# repository-wide ceiling shared with BuildKit, which is what put the pool into
# permanent LRU eviction (12.55GB / 142 entries before this was unwound).
#
# The tiny `pnpm-lockfile-verified-*` cache (607 B) is unaffected -- v3 saves
# and restores it regardless of the `cache` input, and it is the one key here
# that actually exact-hits.
#
# If you turn `cache: true` back on, turn it on for ONE job, not eight, and
# re-read the numbers above first.

jobs:
  # Detect whether any image-affecting paths changed. Used to gate the
  # build-image job on PRs so we only burn CI time when the change could
  # plausibly break the Docker build (e.g., Dockerfile, Next.js code,
  # Prisma schema, deps), not on doc/test-only PRs. Negative-filter
  # approach: default to "build" unless every changed file is something
  # that demonstrably can't affect the image bytes.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.filter.outputs.image }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `every`: a changed file matches a filter only if it satisfies ALL
          # rules. Without this, dorny's default OR semantics make the leading
          # `**` match everything, so the `!`-exclusions are no-ops and every
          # filter is always true (build-image ran on docs/test-only changes;
          # the `tests` gate never skipped heavy jobs). With `every`, a file
          # must match `**` AND none of the `!` excludes. Verified: a docs-only
          # change yields image=false + tests=false; a *.test.ts-only change
          # yields image=false (no image build) + tests=true.
          predicate-quantifier: 'every'
          filters: |
            image:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!tests/**'
              - '!**/*.test.ts'
              - '!**/*.test.tsx'
              - '!playwright.config.ts'
              - '!vitest*.config.ts'
              - '!.gitignore'
              - '!.gitattributes'
              - '!LICENSE'
              - '!lefthook.yml'
              - '!biome.json'
              - '!renovate.json'
            tests:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  ggshield:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: GitGuardian secret scan
        uses: GitGuardian/ggshield-action@7059aef1ffb7d2374ce27201144f5613beecefe0 # v1.54.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      # knip loads prisma.config.ts, which resolves env('DATABASE_URL') at
      # config *load* time. There is no .env in CI, so without this knip prints
      # `ERROR: Error loading prisma.config.ts` and runs with its Prisma plugin
      # switched off. That went unnoticed because knip exits 0 on a config
      # error; scripts/lint-knip.mjs now fails on it. Nothing here connects --
      # this is the same load-time placeholder the db:generate steps use.
      - run: pnpm lint
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  typecheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm typecheck

  migrate-check:
    runs-on: ubuntu-26.04
    services:
      db:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: housemanager
          POSTGRES_PASSWORD: test
          POSTGRES_DB: housemanager
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U housemanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://housemanager:test@localhost:5432/housemanager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - run: pnpm db:generate
      - name: Apply committed migrations to a fresh DB
        run: pnpm db:deploy
      - name: Verify schema.prisma has no uncommitted drift vs the deployed DB
        # Prisma 7 cannot model vector indexes; the IVFFlat index on
        # `embeddings(embedding)` is declared in raw SQL inside the migration,
        # so `migrate diff` always reports it as a removed index relative to
        # schema.prisma. Filter that one known line out before checking the
        # exit status. Any other diff content fails the job.
        run: |
          set -o pipefail
          diff_output=$(pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma 2>&1 || true)
          echo "$diff_output"
          residual=$(echo "$diff_output" | grep -vE '^\s*(\[\*\] Changed the `embeddings` table|\s*\[-\] Removed index on columns \(embedding\)|Loaded Prisma config from|No difference detected\.|$)' || true)
          if [ -n "$residual" ]; then
            echo "::error::Unexpected schema drift (see above)"
            exit 1
          fi

  unit:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      # Collect a coverage blob (no per-job threshold enforcement — this job
      # sees only unit coverage, which is below the combined floor by design).
      # `--reporter=blob` does NOT suppress thresholds in Vitest 4, so override
      # them to 0 here; the downstream `coverage` job merges both blobs and
      # applies the real floor once against the combined report.
      # Pair blob with the default reporter so a failure prints the failing
      # test name + diff in THIS job's log. With blob alone the log shows only
      # "exit code 1", and the `coverage` job that would decode the blob is
      # skipped when this job fails — so the failure detail never surfaces.
      # Multiple reporters require the per-reporter `--outputFile.blob=` form.
      - run: pnpm test:unit --coverage --reporter=blob --reporter=default --outputFile.blob=.vitest-reports/blob-unit.json --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: .vitest-reports/blob-unit.json
          if-no-files-found: error
          retention-days: 1

  integration:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      # See unit job: collect a coverage blob with thresholds overridden to 0;
      # the `coverage` job merges both blobs and enforces the real floor. Pair
      # blob with the default reporter so a failure names the failing test in
      # this job's log instead of a bare "exit code 1" (the decode happens in
      # the `coverage` job, which is skipped on failure).
      - run: pnpm test:integration --coverage --reporter=blob --reporter=default --outputFile.blob=.vitest-reports/blob-integration.json --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: .vitest-reports/blob-integration.json
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-26.04
    services:
      db:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: housemanager
          POSTGRES_PASSWORD: test
          POSTGRES_DB: housemanager
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U housemanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.53@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
        env:
          MEILI_MASTER_KEY: test
          MEILI_ENV: development
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://housemanager:test@localhost:5432/housemanager
      AUTH_SECRET: a-very-long-secret-for-ci-only-not-real-use-32chars
      AUTH_URL: http://localhost:3000
      AUTH_OIDC_ISSUER: http://localhost:9999
      AUTH_OIDC_CLIENT_ID: house-manager
      AUTH_OIDC_CLIENT_SECRET: test
      MEILI_HOST: http://localhost:7700
      MEILI_KEY: test
      FILES_DIR: /tmp/files
      NODE_ENV: development
      # Required by lib/env.ts so the dev server can boot. Push delivery
      # is not exercised in e2e; any non-empty fixture values pass the schema.
      WEB_PUSH_VAPID_PUBLIC_KEY: ci-vapid-public-key-fixture
      WEB_PUSH_VAPID_PRIVATE_KEY: ci-vapid-private-key-fixture
      WEB_PUSH_CONTACT_EMAIL: mailto:ci@example.com
      FORWARDEMAIL_API_KEY: ci-forwardemail-key
      FORWARDEMAIL_FROM_ADDRESS: ci@example.com
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-placeholder-not-used-in-ci' }}
      LOG_LEVEL: info
      # SENTRY_DSN intentionally unset in CI; SDK no-ops gracefully.
      # NEXT_PUBLIC_SENTRY_DSN intentionally unset; browser SDK no-ops gracefully.
      # SENTRY_AUTH_TOKEN intentionally unset; source-map upload skipped.
      # Ask/RAG (Plan 4c): feature gated off in CI to keep e2e cheap and
      # to avoid needing a real Voyage key. OCR backend off prevents the
      # Tesseract.js wasm load on every test run.
      ASK_ENABLED: 'false'
      OCR_BACKEND: 'none'
      # Moves the worker's /api/health off 3000, which `next dev` owns here.
      # Rationale in worker/health-server.ts; CI has no .env to inherit it from.
      # (GitHub Actions does not support YAML anchors, hence the repetition.)
      WORKER_HEALTH_PORT: '3001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:critical
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Accessibility: axe-core WCAG 2.1 AA scans over every route (empty + populated,
  # desktop + mobile). Its own job (not folded into e2e, which runs @critical only)
  # because it walks the full route set. Mirrors the e2e job's services + env.
  a11y:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-26.04
    services:
      db:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: housemanager
          POSTGRES_PASSWORD: test
          POSTGRES_DB: housemanager
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U housemanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.53@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
        env:
          MEILI_MASTER_KEY: test
          MEILI_ENV: development
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://housemanager:test@localhost:5432/housemanager
      AUTH_SECRET: a-very-long-secret-for-ci-only-not-real-use-32chars
      AUTH_URL: http://localhost:3000
      AUTH_OIDC_ISSUER: http://localhost:9999
      AUTH_OIDC_CLIENT_ID: house-manager
      AUTH_OIDC_CLIENT_SECRET: test
      MEILI_HOST: http://localhost:7700
      MEILI_KEY: test
      FILES_DIR: /tmp/files
      NODE_ENV: development
      WEB_PUSH_VAPID_PUBLIC_KEY: ci-vapid-public-key-fixture
      WEB_PUSH_VAPID_PRIVATE_KEY: ci-vapid-private-key-fixture
      WEB_PUSH_CONTACT_EMAIL: mailto:ci@example.com
      FORWARDEMAIL_API_KEY: ci-forwardemail-key
      FORWARDEMAIL_FROM_ADDRESS: ci@example.com
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-placeholder-not-used-in-ci' }}
      LOG_LEVEL: info
      ASK_ENABLED: 'false'
      OCR_BACKEND: 'none'
      # Moves the worker's /api/health off 3000, which `next dev` owns here.
      # Rationale in worker/health-server.ts; CI has no .env to inherit it from.
      # (GitHub Actions does not support YAML anchors, hence the repetition.)
      WORKER_HEALTH_PORT: '3001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 14

  # Merge the coverage blobs emitted by the parallel unit + integration jobs
  # and enforce the configured thresholds (vitest.config.ts) once against the
  # COMBINED report. The individual jobs deliberately don't enforce — neither
  # alone would clear the floor, and double-enforcing would be wrong.
  coverage:
    needs: [changes, unit, integration]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      # Both artifacts land flat in .vitest-reports/ (each is a single
      # blob-*.json), which is the directory `--merge-reports` reads.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .vitest-reports
          pattern: coverage-*
          merge-multiple: true
      # Merge unit+integration blobs and apply the coverage thresholds to the
      # combined report. `--coverage` here makes vitest enforce the floor;
      # the run fails if combined coverage is below it.
      - run: pnpm exec vitest --merge-reports=.vitest-reports --coverage --reporter=default

  build-image:
    needs: [changes, ggshield, lint, typecheck, migrate-check, unit, integration, e2e, a11y, coverage]
    # Always build on main (so we can push + publish a manifest for every
    # commit). On PRs, only build when image-affecting paths changed —
    # this catches regressions like the Plan 5a SENTRY_DSN one (broken
    # docker build that PR CI didn't surface) without burning CI on
    # doc-only PRs. Push only on main; PR builds verify the build
    # succeeds without polluting GHCR.
    # Test jobs (unit/integration/e2e/coverage) are now conditional, so on a
    # docs-only push to main they SKIP — and a skipped `needs` would normally
    # cascade-skip build-image, breaking the per-commit publish. always() lets
    # this run despite skipped deps, while still failing fast on a real
    # failure/cancellation upstream.
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (github.ref == 'refs/heads/main' || needs.changes.outputs.image == 'true')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Renovate's built-in github-actions manager CANNOT see these labels: it
      # reads `runs-on:` off parsed YAML, where this job's value is the literal
      # string `${{ matrix.runner }}` with no version in it. Left untracked that
      # fails GREEN — amd64 and arm64 build on different Ubuntu releases, both
      # runner images work, and nothing flags the mismatch (doc-scanner#209; here
      # #481 bumped 12 literal `runs-on:` values and left these two behind).
      # They are now tracked by a second `github-runners` customManager in the
      # shared preset (owine/renovate-config#103), which keys on the `runner:`
      # key and lands them in the SAME PR as the literal values. So do not bump
      # by hand — but keep the shape: one line per label, `runner: <os>-<ver>`,
      # version first character a digit, suffix included (`26.04-arm` is its own
      # datasource version, not `26.04` decorated). Moving a label behind an env
      # var, renaming the key, or splitting it across lines makes it untracked
      # again, silently and with no error anywhere.
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      # NO `cache-from`/`cache-to: type=gha` here, deliberately. It was
      # `mode=max` until this was measured, and the export cost more than the
      # import ever returned. `COPY . .` (Dockerfile:27) sits in the `build`
      # stage above every expensive step, and `.github/` is not in
      # .dockerignore, so essentially every commit -- including workflow-only
      # ones -- invalidates it. Only `base` and `deps` (Dockerfile:3-22) can
      # survive a run, and the amd64 numbers say even that is noise:
      #
      #   run           change            step   gha export   net build   deps
      #   34882853997   next 16.3.5       272s      155.9s       116s    REBUILT
      #   34919347550   react-hook-form   342s      220.7s       121s    REBUILT
      #   35245802272   Alpine apk pins   183s       73.9s       109s    CACHED
      #   35450895233   ci.yml only       140s       38.0s       102s    CACHED
      #   35548033635   ci.yml only       190s       73.4s       117s    CACHED
      #   35548752591   lockfile          302s      186.1s       116s    REBUILT
      #
      # Net build work is 102-121s whether the deps layer hit or not, so the
      # import bought <=15s. The export cost 38-221s per platform leg per run
      # (62% of the #488 amd64 step) and was 5.55GB of the repo's 10GB cache
      # quota. `mode=min` does not rescue it: it would export the runtime
      # stage's layers, which are `COPY --from=build` of a stage that just
      # rebuilt, so it pays an export for an import that cannot hit either.
      #
      # If you reinstate this, re-measure `exporting to GitHub Actions Cache`
      # against `net build` -- a green run proves nothing about either.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # On main: build by digest and push to GHCR; publish-manifest
          # downstream consumes the digest. On PRs: build to verify the
          # Dockerfile + bundle works, but don't push (no GHCR pollution).
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' }}
      # The build above uses an explicit `outputs:` with push-by-digest, so the
      # image is never tagged locally and `load: true` is not a drop-in. This
      # second invocation runs against the same buildx builder in the same job,
      # so every layer is already in buildkit's LOCAL cache and nothing is
      # recompiled -- verified in the logs, which show all 28 steps CACHED in
      # 8-11s. That is why it needs no `cache-from`. The cost is the `load`
      # export of the image into the docker daemon, which is minutes, not
      # seconds — hence the timeout below.
      - name: Load image locally for smoke test
        timeout-minutes: 15
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          load: true
          tags: house-manager:smoke
      # Boots both roles from the image that was actually built. Guards the
      # standalone bundle and (in the follow-up PR) the pruned worker tree.
      - name: Smoke test the image
        timeout-minutes: 10
        run: ./scripts/smoke-image.sh house-manager:smoke
      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Build the args via arrays so shellcheck doesn't complain about
          # unquoted command substitution (SC2046) — the original
          # $(jq ...) / $(printf ...) form relied on word splitting,
          # which is correct here but a real foot-gun pattern.
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do
            images+=("ghcr.io/${{ github.repository }}@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  # Single aggregator gate for branch protection. Path-filtered jobs
  # (unit/integration/e2e/a11y/coverage/build-image) skip on docs-only PRs,
  # but their matrix-named contexts are still listed as required in the
  # ruleset — which leaves docs-only PRs permanently BLOCKED with "expected
  # check not reported". Requiring only this aggregator (instead of each
  # underlying matrix child) lets a SKIP count as passing while a real
  # failure still fails. Mirrors the `always() && !failure() && !cancelled()`
  # idiom already used by `build-image` above.
  ci-pass:
    needs: [changes, ggshield, lint, typecheck, migrate-check, unit, integration, e2e, a11y, coverage, build-image]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: All required jobs passed or were appropriately skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Log only the per-job `result` field, never the full `needs` blob.
          # `outputs` declared by upstream jobs could carry sensitive values
          # if anyone adds one in the future; restricting the dump to results
          # keeps the diagnostic ("which job failed?") without the leak risk.
          echo "$NEEDS_JSON" | jq 'map_values({result})'
          if echo "$NEEDS_JSON" | jq -e 'any(.[].result; . == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
