savePrefix: ""

# Settings below were moved out of `.npmrc`, which pnpm 11 no longer reads them
# from. As of pnpm 11, INI files (.npmrc, the global rc) hold ONLY registry,
# authentication and certificate settings; every other setting lives in YAML —
# pnpm-workspace.yaml per project, config.yaml globally. Keys left in .npmrc are
# not rejected, they are simply never parsed: no warning, no error, no effect.
# Verify a setting is actually live with `pnpm config get <camelCaseKey>`.

# CI safety: `pnpm install` errors if the lockfile has drifted from package.json
# rather than silently repairing it, so a stale lockfile on a long-lived branch
# fails the PR instead of resolving to something nobody reviewed.
preferFrozenLockfile: true

# `pnpm audit` fails on moderate-and-above advisories.
# (`audit.level` supersedes the older top-level `auditLevel`, added in 11.15.)
audit:
  level: moderate

# Release-age soak lives in Renovate, NOT here.
#
# The shared preset (github>owine/renovate-config) already gates every update on
# age: 3 days for minor/patch, 7 days for majors, 0 for CVEs and lockfile
# maintenance. Renovate is the only thing that adds dependencies to this repo,
# so that gate is the one that matters.
#
# `minimumReleaseAge` is therefore deliberately absent. A second, pnpm-side soak
# is not defence in depth — the two gates guard different moments. Renovate's
# decides when a PR may open; pnpm's decides when a lockfile may be written. Any
# release landing in the gap between them yields a PR that can never pass CI:
# Renovate bumps package.json to a version pnpm then refuses to resolve,
# `renovate/artifacts` fails, the lockfile stays stale, and
# `pnpm install --frozen-lockfile` rejects the result. The 0-day CVE tier fails
# hardest — a security fix could not land at all. See owine/resume PR #53
# (wrangler 4.110.0) for the worked example.
#
# A stricter soak here does not make the repo safer; it stops updates from
# landing, which over time makes it less safe.

# Build-script allowlist. pnpm 11+ defaults strictDepBuilds: true so any
# package not listed here errors at install time rather than silently
# skipping its postinstall. Keep this list minimal — entries here run
# arbitrary code at install time. Each was vetted at the time of inclusion.
allowBuilds:
  "@prisma/engines": true # downloads Prisma query engine binaries
  "@sentry/cli": true # downloads sentry-cli native binary
  "cpu-features": true # builds native CPU feature detection (transitive of ssh2)
  "esbuild": true # builds platform-specific esbuild binary
  "lefthook": true # installs git hooks
  "msw": true # writes service-worker file (transitive)
  "prisma": true # CLI ships native binaries
  "protobufjs": true # generates static protobuf code (transitive)
  "sharp": true # builds libvips bindings
  "ssh2": true # optional native crypto (transitive)
  tesseract.js: true # downloads English language data at install time (Plan 4c)
